<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Калькулятор мерджу Archero 2</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏹</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0c1222;
      --bg-card: #151d33;
      --bg-card-sub: #1c2642;
      --bg-input: #0a0f1d;
      --border-main: #2b3859;
      --border-accent: #f59e0b;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      /* Archero Rarity Colors */
      --c-common: #94a3b8;
      --c-great: #22c55e;
      --c-rare: #3b82f6;
      --c-epic: #a855f7;
      --c-legendary: #f59e0b;
      --c-mythic: #ef4444;
      --c-chaos: #ec4899;
      
      --shadow-card: 0 6px 0 #070a14;
      --shadow-btn: 0 4px 0 #070a14;
      --shadow-btn-gold: 0 4px 0 #b45309;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #172344 0%, var(--bg-main) 75%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 16px 12px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 8px 0 4px;
    }

    h1 {
      font-family: 'Lilita One', cursive;
      font-size: 32px;
      letter-spacing: 1px;
      color: #ffd166;
      text-shadow: 0 3px 0 #b45309, 0 0 20px rgba(255, 209, 102, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Mode Navigation Tabs */
    .tabs-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(10, 15, 29, 0.7);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border-main);
    }

    .mode-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: 'Lilita One', cursive;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-tab.active {
      color: #0c1222;
      background: linear-gradient(180deg, #ffd166 0%, #f59e0b 100%);
      box-shadow: 0 4px 0 #b45309, 0 0 15px rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }

    /* Section Card */
    .section-card {
      background: var(--bg-card);
      border: 2px solid var(--border-main);
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: var(--shadow-card);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .section-title {
      font-family: 'Lilita One', cursive;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: #ffd166;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reset-btn {
      background: #202b45;
      border: 1px solid var(--border-main);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 #0f1626;
      transition: 0.15s;
    }
    .reset-btn:hover {
      background: #2d3b5d;
      color: #fff;
    }
    .reset-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 1. Target Selector Grid */
    .tiers-scroll {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
    }

    .tier-chip {
      background: var(--bg-card-sub);
      border: 2px solid var(--border-main);
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 3px 0 #0f1626;
      user-select: none;
    }

    .tier-chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0f1626;
    }

    .tier-chip.active {
      border-color: #ffd166;
      background: linear-gradient(180deg, #2b395d, #1b253f);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.4), 0 3px 0 #0f1626;
      transform: translateY(-2px);
    }

    .tier-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lilita One', cursive;
      font-size: 19px;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.25);
    }

    /* Hexagon shape for Runes */
    .tier-icon-box.hexagon {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      border-radius: 0;
      border: none;
    }

    .tier-chip-name {
      font-family: 'Lilita One', cursive;
      font-size: 13px;
      letter-spacing: 0.3px;
      text-align: center;
      line-height: 1.1;
    }

    .tier-chip-sub {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* 2. Inventory (What You Already Have) */
    .inventory-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inv-row {
      background: var(--bg-card-sub);
      border: 1px solid var(--border-main);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 3px 0 #0f1626;
      flex-wrap: wrap;
    }

    .inv-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 190px;
    }

    .inv-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lilita One', cursive;
      font-size: 16px;
      font-weight: 800;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.25), 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .inv-badge.hexagon {
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      border-radius: 0;
    }

    .inv-name-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .inv-name {
      font-family: 'Lilita One', cursive;
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    .inv-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .downgrade-tag {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #ffd166;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 800;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-btn {
      width: 36px;
      height: 36px;
      background: #253352;
      border: 1px solid var(--border-main);
      border-radius: 10px;
      color: #fff;
      font-family: 'Lilita One', cursive;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #0d1424;
      transition: 0.1s;
      user-select: none;
    }

    .step-btn:hover {
      background: #32446e;
    }

    .step-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0d1424;
    }

    .step-input {
      width: 58px;
      height: 36px;
      background: var(--bg-input);
      border: 1.5px solid var(--border-main);
      border-radius: 10px;
      color: #ffd166;
      font-family: 'Lilita One', cursive;
      font-size: 18px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    .step-input:focus {
      border-color: #ffd166;
      box-shadow: 0 0 8px rgba(255, 209, 102, 0.3);
    }

    /* 3. Summary & Remaining Section */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--bg-card-sub);
      border: 2px solid var(--border-main);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      box-shadow: var(--shadow-btn);
    }

    .summary-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-value {
      font-family: 'Lilita One', cursive;
      font-size: 30px;
      color: #ffd166;
      line-height: 1.1;
      text-shadow: 0 2px 0 rgba(0,0,0,0.5);
    }

    .summary-hint {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Progress bar */
    .progress-box {
      background: var(--bg-card-sub);
      border: 1px solid var(--border-main);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-title {
      font-family: 'Lilita One', cursive;
      font-size: 15px;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }

    .progress-pct {
      font-family: 'Lilita One', cursive;
      font-size: 18px;
      color: #22c55e;
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }

    .bar-track {
      width: 100%;
      height: 16px;
      background: #090e1a;
      border: 1px solid var(--border-main);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b 0%, #ffd166 100%);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    /* Synthesis Path Steps */
    .path-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .path-card {
      background: #0d1527;
      border: 1px solid var(--border-main);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .path-target {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Lilita One', cursive;
      font-size: 15px;
      min-width: 170px;
    }

    .path-arrow {
      color: #ffd166;
      font-family: 'Lilita One', cursive;
      font-size: 18px;
    }

    .path-reqs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #17223c;
      border: 1px solid var(--border-main);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill b {
      font-family: 'Lilita One', cursive;
      font-size: 14px;
    }

    /* Rarity badge backgrounds */
    .bg-common { background: #64748b; color: #fff; }
    .bg-great { background: #16a34a; color: #fff; }
    .bg-rare { background: #2563eb; color: #fff; }
    .bg-epic { background: #9333ea; color: #fff; }
    .bg-legendary { background: #d97706; color: #fff; }
    .bg-mythic { background: #dc2626; color: #fff; }

    .color-common { color: var(--c-common); }
    .color-great { color: var(--c-great); }
    .color-rare { color: var(--c-rare); }
    .color-epic { color: var(--c-epic); }
    .color-legendary { color: var(--c-legendary); }
    .color-mythic { color: var(--c-mythic); }

    /* Footer */
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    footer a {
      color: #ffd166;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      h1 { font-size: 26px; }
      .section-card { padding: 16px 12px; }
      .tiers-scroll { grid-template-columns: repeat(4, 1fr); }
      .summary-value { font-size: 26px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <h1>🏹 Archero 2 Calculator</h1>
      <p class="subtitle">Калькулятор мерджу спорядження S та рун</p>
    </header>

    <!-- Mode Tabs: Gear S / Runes -->
    <div class="tabs-wrapper">
      <button class="mode-tab active" id="tabGear" onclick="setMode('gear')">
        <span>⚔️</span> Спорядження S
      </button>
      <button class="mode-tab" id="tabRunes" onclick="setMode('runes')">
        <span>🔮</span> Руни
      </button>
    </div>

    <!-- 1. Target Rarity Section -->
    <section class="section-card">
      <div class="section-header">
        <div class="section-title">
          <span>1. Ціль</span>
        </div>
        <div class="section-actions">
          <span id="targetBadgeDisplay" style="font-family:'Lilita One',cursive; font-size:16px; color:#ffd166;"></span>
        </div>
      </div>
      <div class="tiers-scroll" id="targetGrid"></div>
    </section>

    <!-- 2. Inventory (What You Already Have) -->
    <section class="section-card">
      <div class="section-header">
        <div class="section-title">
          <span>2. Що вже маєш</span>
        </div>
        <div class="section-actions">
          <button class="reset-btn" onclick="resetInventory()">Скинути все</button>
        </div>
      </div>
      <div class="inventory-list" id="inventoryList"></div>
    </section>

    <!-- 3. What You Still Need & Progress -->
    <section class="section-card">
      <div class="section-header">
        <div class="section-title">
          <span>3. Ще потрібно</span>
        </div>
      </div>

      <!-- Summary Cards Grid -->
      <div class="summary-grid" id="summaryGrid"></div>

      <!-- Progress Bar -->
      <div class="progress-box">
        <div class="progress-header">
          <span class="progress-title">Прогрес до цілі</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="progressBar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Step by Step Path -->
      <div class="section-title" style="font-size: 16px; margin-bottom: 12px;">
        <span>Покроковий шлях злиття:</span>
      </div>
      <div class="path-steps" id="pathSteps"></div>
    </section>

    <footer>
      Archero 2 Clan Companion • <a href="https://github.com/isakawar/Archero-2" target="_blank">GitHub</a>
    </footer>
  </div>

  <script>
    // --- GEAR S DEFINITIONS & RULES ---
    // According to the official Archero 2 chart:
    // Epic (E): 1 S copy
    // Epic +1 (E1): E + 1 Epic Fodder (1 S, 1 Epic Fodder)
    // Epic +2 (E2): E1 + 2 Epic Fodder (1 S, 3 Epic Fodder)
    // Legendary (L): 2x E2 (2 S, 6 Epic Fodder)
    // Legendary +1 (L1): L + 1 Leg Fodder
    // Legendary +2 (L2): L1 + 1 Leg Fodder
    // Legendary +3 (L3): L2 + 2 Leg Fodder (2 S, 6 Epic Fodder, 4 Leg Fodder) [equivalent to 38 base Epic Fodder]
    // Mythic (M): 2x L3 (4 S, 12 Epic Fodder, 8 Leg Fodder) [76 Epic Fodder total]
    // Mythic +1 (M1): M + 1x L3 (6 S, 18 Epic Fodder, 12 Leg Fodder) [114 Epic Fodder total]
    // Mythic +2 (M2): M1 + 1x L3 (8 S, 24 Epic Fodder, 16 Leg Fodder) [152 Epic Fodder total]
    // Mythic +3 (M3): M2 + 1x L3 (10 S, 30 Epic Fodder, 20 Leg Fodder) [190 Epic Fodder total]
    // Mythic +4 (M4): M3 + 1x L3 (12 S, 36 Epic Fodder, 24 Leg Fodder) [228 Epic Fodder total]

    const GEAR_TIERS = [
      { id: 'epic', name: 'Епічний', sub: 'Epic', copies: 1, epicFodder: 0, legFodder: 0, colorClass: 'color-epic', bgClass: 'bg-epic', icon: 'E' },
      { id: 'epic_1', name: 'Епічний +1', sub: 'Epic +1', copies: 1, epicFodder: 1, legFodder: 0, colorClass: 'color-epic', bgClass: 'bg-epic', icon: 'E+1', canDowngrade: true },
      { id: 'epic_2', name: 'Епічний +2', sub: 'Epic +2', copies: 1, epicFodder: 3, legFodder: 0, colorClass: 'color-epic', bgClass: 'bg-epic', icon: 'E+2', canDowngrade: true },
      { id: 'legendary', name: 'Легендарний', sub: 'Legendary', copies: 2, epicFodder: 6, legFodder: 0, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: 'L' },
      { id: 'legendary_1', name: 'Легенд. +1', sub: 'Legendary +1', copies: 2, epicFodder: 6, legFodder: 1, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: 'L+1' },
      { id: 'legendary_2', name: 'Легенд. +2', sub: 'Legendary +2', copies: 2, epicFodder: 6, legFodder: 2, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: 'L+2' },
      { id: 'legendary_3', name: 'Легенд. +3', sub: 'Legendary +3', copies: 2, epicFodder: 6, legFodder: 4, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: 'L+3' },
      { id: 'mythic', name: 'Міфічний', sub: 'Mythic', copies: 4, epicFodder: 12, legFodder: 8, colorClass: 'color-mythic', bgClass: 'bg-mythic', icon: 'M' },
      { id: 'mythic_1', name: 'Міфічний +1', sub: 'Mythic +1', copies: 6, epicFodder: 18, legFodder: 12, colorClass: 'color-mythic', bgClass: 'bg-mythic', icon: 'M+1' },
      { id: 'mythic_2', name: 'Міфічний +2', sub: 'Mythic +2', copies: 8, epicFodder: 24, legFodder: 16, colorClass: 'color-mythic', bgClass: 'bg-mythic', icon: 'M+2' },
      { id: 'mythic_3', name: 'Міфічний +3', sub: 'Mythic +3', copies: 10, epicFodder: 30, legFodder: 20, colorClass: 'color-mythic', bgClass: 'bg-mythic', icon: 'M+3' },
      { id: 'mythic_4', name: 'Міфічний +4', sub: 'Mythic +4', copies: 12, epicFodder: 36, legFodder: 24, colorClass: 'color-mythic', bgClass: 'bg-mythic', icon: 'M+4' }
    ];

    // --- RUNES DEFINITIONS & RULES ---
    // Common -> Great (3x) -> Rare (3x) -> Epic (3x = 27)
    // Epic -> Epic+1 (2x = 54) -> Epic+2 (2x = 108) -> Legendary (2x = 216)
    // Legendary+1 (2x = 432) -> Legendary+2 (2x = 864) -> Legendary+3 (2x = 1728) -> Mythic (2x = 3456)
    const RUNE_TIERS = [
      { id: 'common', name: 'Звичайний', sub: 'Common', grayMult: 1, colorClass: 'color-common', bgClass: 'bg-common', icon: '1' },
      { id: 'great', name: 'Незвичайний', sub: 'Great', grayMult: 3, colorClass: 'color-great', bgClass: 'bg-great', icon: '2' },
      { id: 'rare', name: 'Рідкісний', sub: 'Rare', grayMult: 9, colorClass: 'color-rare', bgClass: 'bg-rare', icon: '3' },
      { id: 'epic', name: 'Епічний', sub: 'Epic', grayMult: 27, colorClass: 'color-epic', bgClass: 'bg-epic', icon: '4' },
      { id: 'epic_1', name: 'Епічний +1', sub: 'Epic +1', grayMult: 54, colorClass: 'color-epic', bgClass: 'bg-epic', icon: '5' },
      { id: 'epic_2', name: 'Епічний +2', sub: 'Epic +2', grayMult: 108, colorClass: 'color-epic', bgClass: 'bg-epic', icon: '6' },
      { id: 'legendary', name: 'Легендарний', sub: 'Legendary', grayMult: 216, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: '7' },
      { id: 'legendary_1', name: 'Легенд. +1', sub: 'Legendary +1', grayMult: 432, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: '8' },
      { id: 'legendary_2', name: 'Легенд. +2', sub: 'Legendary +2', grayMult: 864, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: '9' },
      { id: 'legendary_3', name: 'Легенд. +3', sub: 'Legendary +3', grayMult: 1728, colorClass: 'color-legendary', bgClass: 'bg-legendary', icon: '10' },
      { id: 'mythic', name: 'Міфічний', sub: 'Mythic', grayMult: 3456, colorClass: 'color-mythic', bgClass: 'bg-mythic', icon: '11' }
    ];

    // --- APP STATE ---
    let currentMode = 'gear'; // 'gear' or 'runes'
    let selectedGearTarget = 'mythic_1'; // Default as in mockup
    let selectedRuneTarget = 'mythic';

    // Gear inventory: initial example from mockup has 1x Legendary +3
    let gearInventory = {
      legendary_3: 1,
      epic_fodder: 0,
      legendary_fodder: 0
    };

    // Rune inventory
    let runeInventory = {
      legendary: 1
    };

    // Load saved state from localStorage if available
    try {
      const savedMode = localStorage.getItem('archero2_calc_mode');
      if (savedMode) currentMode = savedMode;
      const savedGearTarget = localStorage.getItem('archero2_gear_target');
      if (savedGearTarget) selectedGearTarget = savedGearTarget;
      const savedGearInv = localStorage.getItem('archero2_gear_inv');
      if (savedGearInv) gearInventory = JSON.parse(savedGearInv);
      const savedRuneTarget = localStorage.getItem('archero2_rune_target');
      if (savedRuneTarget) selectedRuneTarget = savedRuneTarget;
      const savedRuneInv = localStorage.getItem('archero2_rune_inv');
      if (savedRuneInv) runeInventory = JSON.parse(savedRuneInv);
    } catch(e) {}

    function saveState() {
      try {
        localStorage.setItem('archero2_calc_mode', currentMode);
        localStorage.setItem('archero2_gear_target', selectedGearTarget);
        localStorage.setItem('archero2_gear_inv', JSON.stringify(gearInventory));
        localStorage.setItem('archero2_rune_target', selectedRuneTarget);
        localStorage.setItem('archero2_rune_inv', JSON.stringify(runeInventory));
      } catch(e) {}
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('tabGear').classList.toggle('active', mode === 'gear');
      document.getElementById('tabRunes').classList.toggle('active', mode === 'runes');
      saveState();
      renderAll();
    }

    function resetInventory() {
      if (currentMode === 'gear') {
        gearInventory = {};
      } else {
        runeInventory = {};
      }
      saveState();
      renderAll();
    }

    function changeQty(key, delta) {
      const inv = currentMode === 'gear' ? gearInventory : runeInventory;
      const current = Math.max(0, parseInt(inv[key] || 0, 10));
      const updated = Math.max(0, current + delta);
      if (updated === 0) {
        delete inv[key];
      } else {
        inv[key] = updated;
      }
      saveState();
      renderAll();
    }

    function setDirectQty(key, val) {
      const inv = currentMode === 'gear' ? gearInventory : runeInventory;
      const parsed = Math.max(0, parseInt(val, 10) || 0);
      if (parsed === 0) {
        delete inv[key];
      } else {
        inv[key] = parsed;
      }
      saveState();
      renderAll();
    }

    // --- RENDER 1: TARGET SELECTOR ---
    function renderTargetSelector() {
      const container = document.getElementById('targetGrid');
      container.innerHTML = '';
      const tiers = currentMode === 'gear' ? GEAR_TIERS : RUNE_TIERS;
      const currentSelected = currentMode === 'gear' ? selectedGearTarget : selectedRuneTarget;
      const isRune = currentMode === 'runes';

      const targetObj = tiers.find(t => t.id === currentSelected) || tiers[tiers.length - 1];
      document.getElementById('targetBadgeDisplay').innerText = `Ціль: ${targetObj.name}`;

      tiers.forEach(t => {
        const btn = document.createElement('div');
        btn.className = `tier-chip ${t.id === currentSelected ? 'active' : ''}`;
        btn.onclick = () => {
          if (currentMode === 'gear') selectedGearTarget = t.id;
          else selectedRuneTarget = t.id;
          saveState();
          renderAll();
        };

        btn.innerHTML = `
          <div class="tier-icon-box ${t.bgClass} ${isRune ? 'hexagon' : ''}">
            ${t.icon}
          </div>
          <div class="tier-chip-name ${t.colorClass}">${t.name}</div>
          <div class="tier-chip-sub">${t.sub}</div>
        `;
        container.appendChild(btn);
      });
    }

    // --- RENDER 2: INVENTORY SECTION ---
    function renderInventory() {
      const container = document.getElementById('inventoryList');
      container.innerHTML = '';

      if (currentMode === 'gear') {
        const targetIndex = GEAR_TIERS.findIndex(t => t.id === selectedGearTarget);
        // Available tiers to have are all tiers below the target
        const availableTiers = GEAR_TIERS.slice(0, targetIndex).reverse();

        // 1. Specific S-Gear tiers
        availableTiers.forEach(t => {
          const count = gearInventory[t.id] || 0;
          const row = document.createElement('div');
          row.className = 'inv-row';

          row.innerHTML = `
            <div class="inv-info">
              <div class="inv-badge ${t.bgClass}">${t.icon}</div>
              <div class="inv-name-box">
                <div class="inv-name ${t.colorClass}">${t.name}</div>
                <div class="inv-sub">
                  ${t.sub}
                  ${t.canDowngrade ? '<span class="downgrade-tag">можна понизити</span>' : ''}
                </div>
              </div>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="changeQty('${t.id}', -1)">−</button>
              <input type="number" class="step-input" value="${count}" min="0" onchange="setDirectQty('${t.id}', this.value)" />
              <button class="step-btn" onclick="changeQty('${t.id}', 1)">+</button>
            </div>
          `;
          container.appendChild(row);
        });

        // 2. Legendary Fodder row (if target is Legendary+1 or higher)
        if (targetIndex >= 4) {
          const legFodderCount = gearInventory['legendary_fodder'] || 0;
          const rowLeg = document.createElement('div');
          rowLeg.className = 'inv-row';
          rowLeg.style.borderColor = 'rgba(245, 158, 11, 0.4)';
          rowLeg.innerHTML = `
            <div class="inv-info">
              <div class="inv-badge bg-legendary">LF</div>
              <div class="inv-name-box">
                <div class="inv-name color-legendary">Легендарний фураж</div>
                <div class="inv-sub">Будь-який леґендарний корм (= 8 епіків)</div>
              </div>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="changeQty('legendary_fodder', -1)">−</button>
              <input type="number" class="step-input" value="${legFodderCount}" min="0" onchange="setDirectQty('legendary_fodder', this.value)" />
              <button class="step-btn" onclick="changeQty('legendary_fodder', 1)">+</button>
            </div>
          `;
          container.appendChild(rowLeg);
        }

        // 3. Epic Fodder row
        const epicFodderCount = gearInventory['epic_fodder'] || 0;
        const rowEpic = document.createElement('div');
        rowEpic.className = 'inv-row';
        rowEpic.style.borderColor = 'rgba(168, 85, 247, 0.4)';
        rowEpic.innerHTML = `
          <div class="inv-info">
            <div class="inv-badge bg-epic">EF</div>
            <div class="inv-name-box">
              <div class="inv-name color-epic">Епічний фураж</div>
              <div class="inv-sub">Будь-яке епічне спорядження на корм</div>
            </div>
          </div>
          <div class="stepper">
            <button class="step-btn" onclick="changeQty('epic_fodder', -1)">−</button>
            <input type="number" class="step-input" value="${epicFodderCount}" min="0" onchange="setDirectQty('epic_fodder', this.value)" />
            <button class="step-btn" onclick="changeQty('epic_fodder', 1)">+</button>
          </div>
        `;
        container.appendChild(rowEpic);

      } else {
        // Runes Inventory
        const targetIndex = RUNE_TIERS.findIndex(t => t.id === selectedRuneTarget);
        const availableTiers = RUNE_TIERS.slice(0, targetIndex).reverse();

        availableTiers.forEach(t => {
          const count = runeInventory[t.id] || 0;
          const row = document.createElement('div');
          row.className = 'inv-row';

          row.innerHTML = `
            <div class="inv-info">
              <div class="inv-badge hexagon ${t.bgClass}">${t.icon}</div>
              <div class="inv-name-box">
                <div class="inv-name ${t.colorClass}">${t.name}</div>
                <div class="inv-sub">${t.sub} (Рівень ${t.icon})</div>
              </div>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="changeQty('${t.id}', -1)">−</button>
              <input type="number" class="step-input" value="${count}" min="0" onchange="setDirectQty('${t.id}', this.value)" />
              <button class="step-btn" onclick="changeQty('${t.id}', 1)">+</button>
            </div>
          `;
          container.appendChild(row);
        });
      }
    }

    // --- RENDER 3: WHAT YOU STILL NEED & PATH ---
    function renderSummaryAndPath() {
      const summaryGrid = document.getElementById('summaryGrid');
      const pathSteps = document.getElementById('pathSteps');
      summaryGrid.innerHTML = '';
      pathSteps.innerHTML = '';

      if (currentMode === 'gear') {
        const target = GEAR_TIERS.find(t => t.id === selectedGearTarget);

        // Calculate total provided by inventory
        let ownedCopies = 0;
        let ownedEpicFodder = Number(gearInventory['epic_fodder'] || 0);
        let ownedLegFodder = Number(gearInventory['legendary_fodder'] || 0);

        GEAR_TIERS.forEach(t => {
          const cnt = Number(gearInventory[t.id] || 0);
          if (cnt > 0) {
            ownedCopies += t.copies * cnt;
            ownedEpicFodder += t.epicFodder * cnt;
            ownedLegFodder += t.legFodder * cnt;
          }
        });

        // Total target requirements
        const reqCopies = target.copies;
        const reqEpic = target.epicFodder;
        const reqLeg = target.legFodder;

        // Still needed
        const remCopies = Math.max(0, reqCopies - ownedCopies);
        const remEpic = Math.max(0, reqEpic - ownedEpicFodder);
        const remLeg = Math.max(0, reqLeg - ownedLegFodder);

        // Progress calculation based on total Epic equivalent points
        // 1 S copy = ~38 Epic equiv, 1 Leg Fodder = 8 Epic, 1 Epic Fodder = 1 Epic
        const totalPointsTarget = (reqCopies * 38) + (reqLeg * 8) + reqEpic;
        const totalPointsOwned = (ownedCopies * 38) + (ownedLeg * 8) + ownedEpicFodder;
        const pct = totalPointsTarget > 0 ? Math.min(100, Math.round((totalPointsOwned / totalPointsTarget) * 100)) : 100;

        document.getElementById('progressPct').innerText = `${pct}%`;
        document.getElementById('progressBar').style.width = `${pct}%`;

        // 3 Summary Cards
        summaryGrid.innerHTML = `
          <div class="summary-card">
            <div class="summary-label">
              <span>🟡</span> Копії S-предмета
            </div>
            <div class="summary-value" style="color: #ffd166;">${remCopies} шт.</div>
            <div class="summary-hint">Потрібно: ${reqCopies} | Є в наявності: ${ownedCopies}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">
              <span>🟣</span> Епічний фураж
            </div>
            <div class="summary-value" style="color: var(--c-epic);">${remEpic} шт.</div>
            <div class="summary-hint">Потрібно: ${reqEpic} | Є в наявності: ${ownedEpicFodder}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">
              <span>🟠</span> Легендарний фураж
            </div>
            <div class="summary-value" style="color: var(--c-legendary);">${remLeg} шт.</div>
            <div class="summary-hint">Потрібно: ${reqLeg} | Є в наявності: ${ownedLegFodder}</div>
          </div>
        `;

        // Synthesis Path
        const targetIndex = GEAR_TIERS.findIndex(t => t.id === selectedGearTarget);
        const steps = [
          { target: 'E+1', formula: '1× Епічний (той самий) + 1× Епічний фураж' },
          { target: 'E+2', formula: '1× Епічний +1 + 2× Епічний фураж' },
          { target: 'L (Легендарний)', formula: '2× Епічний +2 (обидва той самий S-предмет)' },
          { target: 'L+1', formula: '1× Легендарний + 1× Легендарний фураж' },
          { target: 'L+2', formula: '1× Легендарний +1 + 1× Легендарний фураж' },
          { target: 'L+3', formula: '1× Легендарний +2 + 2× Легендарний фураж' },
          { target: 'M (Міфічний)', formula: '2× Легендарний +3 (обидва той самий S-предмет)' },
          { target: 'M+1', formula: '1× Міфічний + 1× Легендарний +3 (той самий)' },
          { target: 'M+2', formula: '1× Міфічний +1 + 1× Легендарний +3 (той самий)' },
          { target: 'M+3', formula: '1× Міфічний +2 + 1× Легендарний +3 (той самий)' },
          { target: 'M+4', formula: '1× Міфічний +3 + 1× Легендарний +3 (той самий)' }
        ];

        steps.slice(0, targetIndex).forEach((step, idx) => {
          const card = document.createElement('div');
          card.className = 'path-card';
          card.innerHTML = `
            <div class="path-target">
              <span class="pill bg-legendary">Крок ${idx + 1}</span>
              <span>→ ${step.target}</span>
            </div>
            <div class="path-reqs">
              <span style="font-size: 13px; font-weight: 700; color: #cbd5e1;">${step.formula}</span>
            </div>
          `;
          pathSteps.appendChild(card);
        });

      } else {
        // Runes summary & path
        const target = RUNE_TIERS.find(t => t.id === selectedRuneTarget);
        let ownedGray = 0;

        RUNE_TIERS.forEach(t => {
          const cnt = Number(runeInventory[t.id] || 0);
          if (cnt > 0) {
            ownedGray += t.grayMult * cnt;
          }
        });

        const reqGray = target.grayMult;
        const remGray = Math.max(0, reqGray - ownedGray);
        const remRare = (remGray / 9).toFixed(1).replace('.0', '');
        const remEpic = (remGray / 27).toFixed(1).replace('.0', '');

        const pct = reqGray > 0 ? Math.min(100, Math.round((ownedGray / reqGray) * 100)) : 100;

        document.getElementById('progressPct').innerText = `${pct}%`;
        document.getElementById('progressBar').style.width = `${pct}%`;

        summaryGrid.innerHTML = `
          <div class="summary-card">
            <div class="summary-label">
              <span>⚪</span> Залишилось звичайних рун
            </div>
            <div class="summary-value" style="color: #ffd166;">${remGray.toLocaleString()} шт.</div>
            <div class="summary-hint">Всього еквівалент цілі: ${reqGray.toLocaleString()}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">
              <span>🔵</span> Рідкісний еквівалент (Rare)
            </div>
            <div class="summary-value" style="color: var(--c-rare);">${remRare} шт.</div>
            <div class="summary-hint">1 Рідкісна = 9 Звичайних</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">
              <span>🟣</span> Епічний еквівалент (Epic)
            </div>
            <div class="summary-value" style="color: var(--c-epic);">${remEpic} шт.</div>
            <div class="summary-hint">1 Епічна = 27 Звичайних</div>
          </div>
        `;

        const targetIndex = RUNE_TIERS.findIndex(t => t.id === selectedRuneTarget);
        const runeSteps = [
          'Зелена (Great) ← 3× Звичайна (той самий вид)',
          'Синя (Rare) ← 3× Зелена (той самий вид)',
          'Епічна (Epic) ← 3× Синя (той самий вид)',
          'Епічна +1 ← 2× Епічна (той самий вид)',
          'Епічна +2 ← 2× Епічна +1 (той самий вид)',
          'Легендарна ← 2× Епічна +2 (той самий вид)',
          'Легендарна +1 ← 2× Легендарна (той самий вид)',
          'Легендарна +2 ← 2× Легендарна +1 (той самий вид)',
          'Легендарна +3 ← 2× Легендарна +2 (той самий вид)',
          'Міфічна ← 2× Легендарна +3 (той самий вид)'
        ];

        runeSteps.slice(0, targetIndex).forEach((step, idx) => {
          const card = document.createElement('div');
          card.className = 'path-card';
          card.innerHTML = `
            <div class="path-target">
              <span class="pill bg-great">Рівень ${idx + 2}</span>
            </div>
            <div class="path-reqs">
              <span style="font-size: 13px; font-weight: 700; color: #cbd5e1;">${step}</span>
            </div>
          `;
          pathSteps.appendChild(card);
        });
      }
    }

    function renderAll() {
      renderTargetSelector();
      renderInventory();
      renderSummaryAndPath();
    }

    // Initialize on page load
    renderAll();
  </script>
</body>
</html>
