<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Калькулятор злиття Archero 2</title>
  <link rel="icon" type="image/png" href="icons/gear/L.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1c2747;
      --ink: #2a2238;
      --ink-dark: #1a1030;
      --shadow: #0b1122;
      --cream: #fdf6e9;
      --muted: #6b5a3e;
      --soft: #c9d2ea;
      --soft-2: #aab5d3;
      --gold-a: #ffc23d;
      --gold-b: #f0a21a;
      --gold-text: #ffd56a;
      --lf: 'Lilita One', 'Arial Black', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); }
    a { color: var(--gold-text); } a:hover { color: #fff; }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--gold-text); outline-offset: 2px; }

    .page {
      min-height: 100vh;
      padding: 28px 20px 0;
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%),
        linear-gradient(45deg, rgba(255,255,255,.04) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.04) 75%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }
    .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding-bottom: 40px; }

    .stroke { color: #fff; -webkit-text-stroke: 6px var(--ink-dark); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink-dark); }
    .lf { font-family: var(--lf); font-weight: 400; }

    /* Buttons */
    .btn { transition: transform .06s ease, box-shadow .06s ease; }
    .btn:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), 0 0 0 transparent !important; }

    /* Header */
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 56px; height: 56px; flex: 0 0 auto; border-radius: 16px; border: 3px solid var(--ink-dark);
      background: linear-gradient(#ffc23d, #e08a00);
      box-shadow: inset 0 4px 0 rgba(255,255,255,.5), 0 5px 0 var(--ink-dark);
      display: flex; align-items: center; justify-content: center;
    }
    h1 { margin: 0; font-size: 36px; letter-spacing: .5px; }
    .subtitle { margin: 4px 0 0; font-size: 15px; font-weight: 800; color: var(--soft); }

    .tabs { display: flex; gap: 6px; background: #0f1628; border: 3px solid var(--shadow); padding: 6px; border-radius: 18px; }
    .tab {
      border: 2px solid transparent; border-radius: 12px; padding: 10px 18px; min-height: 44px;
      font-size: 16px; font-weight: 900; background: transparent; color: var(--soft);
    }
    .tab[aria-selected="true"] {
      border-color: var(--ink-dark); color: #3a2200;
      background: linear-gradient(var(--gold-a), var(--gold-b));
      box-shadow: inset 0 3px 0 rgba(255,255,255,.55), 0 4px 0 var(--ink-dark);
    }

    /* Cards */
    .card {
      background: var(--cream); border: 3px solid var(--ink); border-radius: 22px;
      box-shadow: inset 0 4px 0 #fff, 0 7px 0 var(--shadow);
      padding: 22px; display: flex; flex-direction: column; gap: 16px;
    }
    .card h2 { margin: 0; font-size: 24px; color: var(--ink); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .picked { font-size: 15px; font-weight: 800; color: var(--muted); }
    .hint { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); }
    .caps { font-size: 13px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; }

    /* Targets */
    .targets { display: flex; flex-wrap: wrap; gap: 10px; }
    .target {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 12px 6px 8px; min-width: 92px; border-radius: 16px;
      border: 3px solid transparent; background: transparent;
    }
    .target:hover { background: rgba(255, 227, 154, .35); }
    .target[aria-pressed="true"] {
      border-color: var(--ink-dark); background: linear-gradient(#fff6dc, #ffe39a);
      box-shadow: inset 0 3px 0 #fff, 0 4px 0 var(--ink-dark);
    }
    .target-name { font-size: 13px; font-weight: 800; color: #4a3d2a; line-height: 1.15; text-align: center; max-width: 84px; }

    /* Tiles */
    .tile { position: relative; display: inline-flex; flex: 0 0 auto; width: var(--s); height: var(--s); }
    .tile img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
    .tile .s-mark {
      position: absolute; left: -6px; top: -8px; font-family: var(--lf); line-height: 1;
      font-size: max(14px, calc(var(--s) * .34));
      color: #ffd23d; -webkit-text-stroke: max(3px, calc(var(--s) * .095)) #3a1d00; paint-order: stroke fill;
    }
    /* Gear tiles: in-game art cropped to the inner square, frame drawn in CSS */
    .tile.framed .face {
      position: absolute; inset: 0; overflow: hidden;
      border-radius: calc(var(--s) * .24);
      border: max(2px, calc(var(--s) * .05)) solid var(--rd);
      background: var(--rb);
      box-shadow: var(--ring, 0 0 0 transparent), 0 max(2px, calc(var(--s) * .06)) 0 rgba(11, 17, 34, .35);
    }
    .tile.framed .face img { width: 100%; height: 100%; object-fit: cover; filter: none; }
    .tile.framed .face::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 0 0 max(1px, calc(var(--s) * .035)) var(--ra);
      background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 40%, rgba(0,0,0,0) 68%, rgba(0,0,0,.2));
    }
    .tile.framed.r-L { --ring: 0 0 0 max(1.5px, calc(var(--s) * .04)) #ffdb6e; }
    .tile.framed.r-M { --ring: 0 0 0 max(1.5px, calc(var(--s) * .04)) #ffcf5a, 0 0 calc(var(--s) * .22) rgba(255, 92, 70, .55); }
    .tile .lvl {
      position: absolute; left: 50%; bottom: calc(var(--s) * -.13); transform: translateX(-50%);
      min-width: max(16px, calc(var(--s) * .36)); height: max(15px, calc(var(--s) * .3));
      padding: 0 max(3px, calc(var(--s) * .06)); box-sizing: border-box;
      border-radius: 99px; background: linear-gradient(var(--ra), var(--rb));
      border: max(1.5px, calc(var(--s) * .035)) solid #fff;
      box-shadow: 0 0 0 max(1.5px, calc(var(--s) * .03)) var(--rd), 0 2px 0 rgba(0, 0, 0, .25);
      color: #fff; font-family: var(--lf); font-size: max(10px, calc(var(--s) * .21));
      -webkit-text-stroke: max(2px, calc(var(--s) * .05)) var(--rd); paint-order: stroke fill;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }

    /* Layout columns */
    .cols { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    .inv { flex: 1 1 380px; min-width: 0; gap: 14px; }
    .reset { border: 0; background: transparent; font-size: 15px; font-weight: 800; color: #8a4b0a; text-decoration: underline; padding: 10px 4px; min-height: 44px; }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .rows[hidden] { display: none; }
    .fodder-block { border-top: 2px dashed #e2d2b0; padding-top: 14px; }
    .fodder-block .caps { color: var(--muted); }
    .row { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid #e4d5b5; border-radius: 16px; padding: 8px 10px; }
    .row-name { flex: 1 1 auto; min-width: 0; font-weight: 800; font-size: 15px; }
    .down { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 800; color: #1f5a2e; background: #dff3e3; border-radius: 6px; padding: 2px 7px; }
    .step {
      width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px; font-size: 22px; font-weight: 900; line-height: 1;
    }
    .step.minus { border: 2px solid #8a7550; background: #eadcbf; box-shadow: inset 0 3px 0 rgba(255,255,255,.6), 0 3px 0 #8a7550; color: #4a3d2a; }
    .step.plus { border: 2px solid #7a4800; background: linear-gradient(var(--gold-a), var(--gold-b)); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), 0 3px 0 #7a4800; color: #3a2200; }
    .count {
      width: 52px; flex: 0 0 auto; text-align: center; font-family: var(--lf); font-size: 24px; color: var(--ink);
      border: 0; background: transparent; padding: 0; border-radius: 8px; -moz-appearance: textfield; appearance: textfield;
    }
    .count::-webkit-outer-spin-button, .count::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .count:focus { background: #fff3d1; }

    /* Result panel */
    .result {
      position: relative; flex: 1 1 480px; min-width: 0;
      background: linear-gradient(180deg, #2c3760, #222b4c);
      border: 3px solid var(--rb); border-radius: 22px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.12), 0 7px 0 var(--shadow), 0 0 48px var(--rglow);
      padding: 22px; display: flex; flex-direction: column; gap: 18px; color: #fff;
    }
    .result-head { display: flex; align-items: center; gap: 16px; }
    .result-head .caps { display: block; color: var(--soft); }
    .result-head h2 { margin: 2px 0 0; font-size: 30px; }

    .bar { position: relative; height: 30px; background: #0f1628; border: 3px solid var(--shadow); border-radius: 99px; overflow: hidden; }
    .bar-fill {
      height: 100%; border-radius: 99px; background-color: var(--gold-b);
      background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.28) 0 7px, transparent 7px 14px);
      background-size: 28px 28px; box-shadow: inset 0 4px 0 rgba(255,255,255,.35);
      animation: stripes 1s linear infinite; transition: width .35s ease;
    }
    .bar-fill.full { animation: stripes 1s linear infinite, glow 1.4s ease-in-out infinite; }
    .bar-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; -webkit-text-stroke: 4px var(--ink-dark); }
    .ready { margin: 0; text-align: center; font-size: 28px; color: var(--gold-text); }

    .needs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .need {
      background: var(--cream); border: 3px solid var(--ink-dark); color: var(--ink); border-radius: 16px;
      padding: 12px 14px; box-shadow: inset 0 3px 0 #fff, 0 4px 0 var(--shadow);
      display: flex; flex-direction: column; gap: 6px; min-width: 0;
    }
    .need .caps { letter-spacing: .4px; color: var(--muted); }
    .need-val { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .need-num { font-family: var(--lf); font-size: 42px; line-height: 1; color: #fff; -webkit-text-stroke: 7px var(--nc); paint-order: stroke fill; }
    .need-sub { font-size: 13px; font-weight: 700; color: var(--muted); }
    .need { position: relative; }
    .need.wide { grid-column: 1 / -1; }
    .need-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info {
      position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; padding: 0;
      border-radius: 50%; border: 2px solid #c9b48a; background: #fff;
      font-family: var(--lf); font-size: 15px; line-height: 1; color: var(--muted);
      box-shadow: 0 2px 0 #c9b48a;
    }
    .info::before { content: ''; position: absolute; inset: -9px; } /* 44px tap target */
    .need.open .info { background: var(--ink); border-color: var(--ink); color: #fff; box-shadow: none; }
    .need .caps { padding-right: 28px; }
    .need-more {
      grid-column: 1 / -1; padding: 12px 14px; border-radius: 16px;
      background: #16203b; border: 2px solid var(--gold-text); color: #fff;
    }
    .need-more .caps { color: var(--gold-text); }
    .need-more dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
    .need-more dt { font-weight: 700; color: var(--soft); }
    .need-more dd { margin: 0; font-weight: 900; color: #fff; text-align: right; }
    .more {
      align-self: flex-start; border: 2px dashed #d6c39b; background: transparent; border-radius: 12px;
      padding: 8px 14px; min-height: 44px; font-size: 14px; font-weight: 800; color: #8a4b0a;
    }
    .more:hover { background: #fff3d1; }
    @media (min-width: 900px) {
      .result {
        position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto;
        overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #4a5786 transparent;
      }
      .result > * { flex-shrink: 0; }
    }
    .need-alts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .need-unit { margin-left: 2px; font-size: 14px; font-weight: 800; color: var(--muted); }
    .need-alts .need-num { margin-right: 4px; }
    .op-dark { color: var(--muted); font-size: 20px; }
    .alt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; width: 100%; }
    .alt {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px;
      background: #fff; border: 2px solid #eadcbf; min-width: 0;
    }
    .alt-num { font-family: var(--lf); font-size: 20px; color: var(--ink); }
    .alt-name { flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 800; color: var(--muted); text-align: right; line-height: 1.1; }
    .need-or { font-size: 13px; font-weight: 900; text-transform: uppercase; color: #a8916a; }

    .path { display: flex; flex-direction: column; gap: 8px; }
    .path > .caps { color: var(--soft); }
    .path ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .path li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #16203b; border: 2px solid var(--shadow); border-radius: 14px; padding: 8px 12px; }
    .times { font-family: var(--lf); font-size: 22px; min-width: 44px; color: var(--gold-text); -webkit-text-stroke: 5px var(--ink-dark); paint-order: stroke fill; }
    .op { font-family: var(--lf); font-size: 22px; color: #fff; }
    .step-label { flex: 1 1 140px; font-size: 13px; font-weight: 700; color: var(--soft-2); text-align: right; }
    .footnote { margin: 0; font-size: 13px; font-weight: 700; color: var(--soft-2); }

    footer { text-align: center; font-size: 13px; font-weight: 700; color: var(--soft-2); }

    /* Animations */
    .bump { display: inline-block; animation: bump .35s ease; }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
    @keyframes stripes { to { background-position: 28px 0; } }
    @keyframes glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
    @keyframes spark {
      0% { opacity: 0; transform: translateY(8px) scale(.4) rotate(0); }
      40% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-26px) scale(1.1) rotate(90deg); }
    }
    .spark {
      position: absolute; width: 14px; height: 14px; background: var(--gold-text);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      animation: spark 1.6s ease-in-out infinite; pointer-events: none;
    }

    /* Mobile sticky bar */
    .mbar {
      display: none; position: sticky; bottom: 0; margin: 0 -20px;
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
      background: #0f1628; border-top: 3px solid var(--shadow); align-items: center; gap: 12px;
    }
    .mbar-text { flex: 1 1 auto; min-width: 0; font-size: 18px; color: #fff; }
    .mbar-pct { font-size: 20px; color: var(--gold-text); }

    @media (max-width: 760px) {
      .mbar { display: flex; }
      .page { padding: 20px 16px 0; }
      .mbar { margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
      h1 { font-size: 28px; }
      .card, .result { padding: 18px 14px; }
      .targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
      .target { min-width: 0; }
      header, .tabs { width: 100%; }
      .tab { flex: 1 1 0; padding: 8px 6px; font-size: 14px; }
      .row { gap: 6px; padding: 8px; }
      .row-name { font-size: 14px; overflow-wrap: anywhere; }
      .count { width: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bump, .spark, .bar-fill, .bar-fill.full { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3a2200" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v6a4 4 0 0 0 8 0V3"></path><path d="M12 13v8"></path><path d="M8 21h8"></path></svg>
          </div>
          <div>
            <h1 class="lf stroke">Калькулятор злиття</h1>
            <p class="subtitle">Archero 2 · спорядження S-рівня та руни</p>
          </div>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab btn" role="tab" data-mode="gear">Спорядження S</button>
          <button class="tab btn" role="tab" data-mode="rune">Руни</button>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <h2 class="lf">1. Яку ціль хочеш?</h2>
          <span class="picked" id="picked"></span>
        </div>
        <div class="targets" id="targets"></div>
      </section>

      <div class="cols">
        <section class="card inv">
          <div class="card-head" style="align-items:center">
            <h2 class="lf">2. Що вже маєш</h2>
            <button class="reset" data-action="reset">Скинути</button>
          </div>
          <p class="hint">Вкажи готові предмети — вони підуть у злиття замість збирання з нуля.</p>
          <div class="rows" id="invRows"></div>
          <div class="rows fodder-block" id="fodderBlock"></div>
        </section>

        <section class="result" id="result"></section>
      </div>

      <footer>
        Archero 2 Clan Companion · <a href="https://github.com/isakawar/Archero-2" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </div>

    <div class="mbar" id="mbar"></div>
  </div>

  <script>
    // Rarity colors: a = light, b = base, d = dark
    const FR = {
      C: { a: '#9aa4b6', b: '#5d6778', d: '#2b313d' },
      F: { a: '#4fd36a', b: '#1f8a39', d: '#0d3d18' },
      R: { a: '#4f9bff', b: '#1f5fc4', d: '#0c2a5c' },
      E: { a: '#b06cf0', b: '#6e2bb8', d: '#33115e' },
      L: { a: '#ffcc4d', b: '#e08a00', d: '#6b3d00' },
      M: { a: '#ff6a5c', b: '#c4241d', d: '#560908' }
    };

    // --- S-GEAR ---
    const GEAR = [
      { id: 'E', label: 'Епічний', r: 'E', n: 0 },
      { id: 'E1', label: 'Епічний +1', r: 'E', n: 1, down: true },
      { id: 'E2', label: 'Епічний +2', r: 'E', n: 2, down: true },
      { id: 'L', label: 'Легендарний', r: 'L', n: 0 },
      { id: 'L1', label: 'Легендарний +1', r: 'L', n: 1 },
      { id: 'L2', label: 'Легендарний +2', r: 'L', n: 2 },
      { id: 'L3', label: 'Легендарний +3', r: 'L', n: 3 },
      { id: 'M', label: 'Міфічний', r: 'M', n: 0 },
      { id: 'M1', label: 'Міфічний +1', r: 'M', n: 1 },
      { id: 'M2', label: 'Міфічний +2', r: 'M', n: 2 },
      { id: 'M3', label: 'Міфічний +3', r: 'M', n: 3 },
      { id: 'M4', label: 'Міфічний +4', r: 'M', n: 4 }
    ];
    // ef / lf = epic / legendary fodder consumed by this merge
    const GEAR_R = {
      E1: { parts: ['E'], ef: 1 }, E2: { parts: ['E1'], ef: 2 }, L: { parts: ['E2', 'E2'] },
      L1: { parts: ['L'], lf: 1 }, L2: { parts: ['L1'], lf: 1 }, L3: { parts: ['L2'], lf: 2 },
      M: { parts: ['L3', 'L3'] }, M1: { parts: ['M', 'L3'] }, M2: { parts: ['M1', 'L3'] },
      M3: { parts: ['M2', 'L3'] }, M4: { parts: ['M3', 'L3'] }
    };
    // Gear levels with their own icon; M1–M4 reuse M.png plus a number badge
    const GEAR_IMG = new Set(['E', 'E1', 'E2', 'L', 'L1', 'L2', 'L3', 'M']);

    // --- RUNES (Etched / Blessing) ---
    const RUNE = [
      { id: 'C', label: 'Звичайна', r: 'C', n: 0 },
      { id: 'F', label: 'Якісна', r: 'F', n: 0 },
      { id: 'R', label: 'Рідкісна', r: 'R', n: 0 },
      { id: 'E', label: 'Епічна', r: 'E', n: 0 },
      { id: 'E1', label: 'Епічна +1', r: 'E', n: 1 },
      { id: 'E2', label: 'Епічна +2', r: 'E', n: 2 },
      { id: 'L', label: 'Легендарна', r: 'L', n: 0 },
      { id: 'L1', label: 'Легендарна +1', r: 'L', n: 1 },
      { id: 'L2', label: 'Легендарна +2', r: 'L', n: 2 },
      { id: 'L3', label: 'Легендарна +3', r: 'L', n: 3 },
      { id: 'M', label: 'Міфічна', r: 'M', n: 0 }
    ];
    const rr = (n, id) => ({ parts: Array(n).fill(id) });
    const RUNE_R = {
      F: rr(3, 'C'), R: rr(3, 'F'), E: rr(3, 'R'), E1: rr(2, 'E'), E2: rr(2, 'E1'),
      L: rr(2, 'E2'), L1: rr(2, 'L'), L2: rr(2, 'L1'), L3: rr(2, 'L2'), M: rr(2, 'L3')
    };

    // Low (non-S) items merge into epic fodder: grey ×3 → green ×3 → blue ×3 → epic.
    // w = value in grey items
    const LOW = [
      { id: 'R', label: 'Синій предмет', many: 'синіх', r: 'R', w: 9 },
      { id: 'F', label: 'Зелений предмет', many: 'зелених', r: 'F', w: 3 },
      { id: 'C', label: 'Сірий предмет', many: 'сірих', r: 'C', w: 1 }
    ];
    const GREY_PER_EPIC = 27;
    const LOW_BY = Object.fromEntries(LOW.map(l => [l.id, l]));

    // Merge steps to build n epic fodder from low items: uses what's in the pool,
    // the missing greys are assumed to be collected.
    function lowChain(n, inv) {
      const pool = { C: inv.C, F: inv.F, R: inv.R };
      const merges = { F: 0, R: 0, E: 0 };
      const below = { E: 'R', R: 'F', F: 'C' };
      function go(id) {
        if (id !== 'E' && pool[id] > 0) { pool[id]--; return; }
        if (id === 'C') return;
        merges[id]++;
        for (let i = 0; i < 3; i++) go(below[id]);
      }
      for (let i = 0; i < n; i++) go('E');
      const T = id => id === 'E' ? tile('fodder', FOD.E, 44) : tile('item', LOW_BY[id], id === 'C' ? 38 : 44);
      return ['F', 'R', 'E'].filter(id => merges[id]).map(id => ({
        times: merges[id],
        parts: [0, 1, 2].map(() => tile('item', LOW_BY[below[id]], 38)),
        result: T(id),
        label: id === 'E' ? 'Епічний фураж' : LOW_BY[id].label
      }));
    }

    const MODES = {
      gear: { levels: GEAR, recipes: GEAR_R, kind: 'gear' },
      rune: { levels: RUNE, recipes: RUNE_R, kind: 'rune' }
    };

    // Top-down recursion: take ready items from the inventory pool, otherwise merge from parts.
    function solve(recipes, target, inv) {
      const pool = { ...inv };
      const acc = { base: 0, ef: 0, lf: 0, merges: {} };
      function go(id, top) {
        if (!top && (pool[id] || 0) > 0) { pool[id]--; return; }
        const r = recipes[id];
        if (!r) { acc.base++; return; } // base unit: S copy (Epic) or common rune C
        acc.merges[id] = (acc.merges[id] || 0) + 1;
        r.parts.forEach(p => go(p, false));
        acc.ef += r.ef || 0;
        acc.lf += r.lf || 0;
      }
      go(target, true);
      return { acc, left: pool };
    }

    // Missing pieces of the target: the biggest parts of the merge tree that use nothing
    // from the inventory, i.e. items you still have to get (ready or built from scratch).
    function missingPieces(recipes, target, inv) {
      const pool = { ...inv };
      const pieces = {};
      function go(id, top) {
        if (!top && (pool[id] || 0) > 0) { pool[id]--; return true; }
        const r = recipes[id];
        if (!r) return false;
        const used = r.parts.map(p => go(p, false));
        if (top || used.some(Boolean)) {
          r.parts.forEach((p, i) => { if (!used[i]) pieces[p] = (pieces[p] || 0) + 1; });
          return true;
        }
        return false;
      }
      go(target, true);
      return pieces;
    }

    const RUNE_COST = Object.fromEntries(RUNE.map(lv => [lv.id, solve(RUNE_R, lv.id, {}).acc.base]));

    // --- STATE ---
    const STORE_KEY = 'archero2_calc_v2';
    const state = {
      mode: 'gear',
      t: { gear: 8, rune: 10 },
      inv: { gear: {}, rune: {} },
      // S-gear fodder: epic / legendary fodder + low items (C, F, R) that merge into epic fodder
      fod: { ef: 0, lf: 0, C: 0, F: 0, R: 0 }
    };
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (saved) {
        if (MODES[saved.mode]) state.mode = saved.mode;
        for (const m of Object.keys(MODES)) {
          const ti = saved.t && saved.t[m];
          if (Number.isInteger(ti) && ti >= 1 && ti < MODES[m].levels.length) state.t[m] = ti;
          if (saved.inv && saved.inv[m] && typeof saved.inv[m] === 'object') state.inv[m] = saved.inv[m];
        }
        if (saved.fod) {
          // a short-lived version kept fodder per mode: { item, gear }
          const f = saved.fod.gear || saved.fod;
          for (const k of Object.keys(state.fod)) state.fod[k] = Math.max(0, Math.floor(+f[k]) || 0);
        }
      }
    } catch (e) {}
    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    const fmt = n => n.toLocaleString('uk-UA');
    const $ = id => document.getElementById(id);

    // --- TILE (icon) ---
    // kind: 'item' | 'gear' (S) | 'rune' | 'fodder'
    function tile(kind, lv, size) {
      const c = FR[lv.r];
      let src, sMark = false, badge = 0;
      if (kind === 'rune') {
        src = `icons/runes/${lv.id}.png`;
      } else if (kind === 'item') {
        src = `icons/gear/${lv.id}.png`;
      } else if (kind === 'fodder') {
        src = `icons/gear/fod${lv.r}.png`;
      } else {
        src = `icons/gear/${GEAR_IMG.has(lv.id) ? lv.id : 'M'}.png`;
        sMark = size >= 32;
        badge = lv.n;
      }
      const framed = kind !== 'rune';
      const img = `<img src="${src}" alt="" loading="lazy">`;
      return `<span class="tile${framed ? ' framed r-' + lv.r : ''}" style="--s:${size}px;--ra:${c.a};--rb:${c.b};--rd:${c.d}">` +
        (framed ? `<span class="face">${img}</span>` : img) +
        (sMark ? '<span class="s-mark" aria-hidden="true">S</span>' : '') +
        (badge ? `<span class="lvl" aria-hidden="true">${badge}</span>` : '') +
        `</span>`;
    }
    const FOD = { E: { r: 'E' }, L: { r: 'L' } };

    function stepperRow(icon, label, extra, count, key, bump) {
      return `<div class="row">
        ${icon}
        <span class="row-name">${label}${extra}</span>
        <button class="step minus btn" data-step="${key}" data-d="-1" aria-label="Менше: ${label}">−</button>
        <input class="count${bump ? ' bump' : ''}" type="number" min="0" inputmode="numeric" data-key="${key}" value="${count}" aria-label="Кількість: ${label}">
        <button class="step plus btn" data-step="${key}" data-d="1" aria-label="Більше: ${label}">+</button>
      </div>`;
    }

    // --- RENDER ---
    function calc() {
      const m = MODES[state.mode];
      const ti = state.t[state.mode];
      const target = m.levels[ti];
      const inv = state.inv[state.mode];
      const full = solve(m.recipes, target.id, {}).acc;
      const res = solve(m.recipes, target.id, inv).acc;
      return { m, ti, target, inv, full, res };
    }

    function renderTop() {
      const { m, ti, target } = calc();
      document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === state.mode)));
      $('picked').textContent = 'Обрано: ' + target.label;
      $('targets').innerHTML = m.levels.slice(1).map((lv, j) => {
        const i = j + 1;
        return `<button class="target btn" data-target="${i}" aria-pressed="${i === ti}" aria-label="${lv.label}">
          ${tile(m.kind, lv, 54)}
          <span class="target-name">${lv.label}</span>
        </button>`;
      }).join('');
    }

    // UI-only state (not saved): expanded lists, rows touched this session, opened card details
    const ui = { allLevels: false, low: false, touched: new Set(), info: null };
    const NEAREST = 3; // levels right below the target that are always visible

    function toggleBtn(action, text) {
      return `<button class="more btn" data-action="${action}">${text}</button>`;
    }

    function renderInv(bump) {
      const { m, ti, inv, full } = calc();
      const below = m.levels.slice(0, ti).reverse();
      const visible = ui.allLevels ? below : below.filter((lv, i) =>
        i < NEAREST || (inv[lv.id] || 0) > 0 || ui.touched.has('inv:' + lv.id));
      const hidden = below.length - visible.length;
      $('invRows').innerHTML = visible.map(lv =>
        stepperRow(tile(m.kind, lv, 44), lv.label, lv.down ? '<span class="down">можна понизити</span>' : '',
          inv[lv.id] || 0, 'inv:' + lv.id, bump)
      ).join('') +
        (hidden ? toggleBtn('all-levels', `Показати всі рівні · ще ${hidden}`)
          : (ui.allLevels && below.length > NEAREST ? toggleBtn('all-levels', 'Згорнути порожні') : ''));

      const fb = $('fodderBlock');
      if (state.mode === 'gear') {
        const fod = state.fod;
        const rows = [{ k: 'lf', label: 'Легендарний фураж', r: 'L', need: full.lf }, { k: 'ef', label: 'Епічний фураж', r: 'E', need: full.ef }]
          .filter(f => f.need > 0 || fod[f.k] > 0)
          .map(f => stepperRow(tile('fodder', FOD[f.r], 44), f.label, '', fod[f.k], 'fod:' + f.k, bump));
        const lowUsed = LOW.some(l => fod[l.id] > 0 || ui.touched.has('fod:' + l.id));
        const lowOpen = ui.low || lowUsed;
        const low = lowOpen
          ? '<span class="caps" style="margin-top:6px">Нижчі предмети → епічний фураж</span>' +
            '<p class="hint" style="font-size:13px">3 однакових сірих → зелений, 3 зелених → синій, 3 синіх → епічний.</p>' +
            LOW.map(l => stepperRow(tile('item', l, 44), l.label, '', fod[l.id], 'fod:' + l.id, bump)).join('') +
            (lowUsed ? '' : toggleBtn('low', 'Сховати нижчі предмети'))
          : toggleBtn('low', '+ Додати сірі, зелені, сині предмети');
        fb.innerHTML = '<span class="caps">Фураж (будь-які предмети тієї ж рідкості)</span>' + rows.join('') + low;
        fb.hidden = false;
      } else {
        fb.innerHTML = '';
        fb.hidden = true;
      }
    }

    function renderResult(bump) {
      const { m, target, full, res } = calc();
      const mode = state.mode;
      const c = FR[target.r];
      const T = (lv, size) => tile(m.kind, lv, size);
      const byId = Object.fromEntries(m.levels.map(l => [l.id, l]));
      const b = bump ? ' bump' : '';

      let needs, pct, done, mbar, lowSteps = [];
      if (mode === 'gear') {
        const fod = state.fod;
        const lowGrey = LOW.reduce((a, l) => a + fod[l.id] * l.w, 0);
        const fromLow = Math.floor(lowGrey / GREY_PER_EPIC);
        const haveE = fod.ef + fromLow;
        const needEF = Math.max(0, res.ef - haveE);
        // spare epic fodder goes to legendary fodder: 1 legendary = 8 epic
        const spareE = Math.max(0, haveE - res.ef);
        const lfShort = Math.max(0, res.lf - fod.lf);
        const lfFromSpare = Math.min(lfShort, Math.floor(spareE / 8));
        const needLF = lfShort - lfFromSpare;
        const epicForLF = needLF ? needLF * 8 - (spareE - lfFromSpare * 8) : 0;
        // epic fodder still to build (for both fodder kinds) and its cost in grey items
        const epicToBuild = Math.max(0, res.ef + lfShort * 8 - fod.ef);
        const greyLeft = Math.max(0, epicToBuild * GREY_PER_EPIC - lowGrey);
        const gaps = [needEF && needEF + ' епічних', needLF && needLF + ' легендарних'].filter(Boolean).join(' і ');
        const lfHave = Math.min(fod.lf, res.lf);
        const pieces = missingPieces(m.recipes, target.id, state.inv.gear);
        const gapLv = m.levels.slice().reverse().filter(lv => pieces[lv.id]);
        needs = [
          gapLv.length && { id: 'sgap', wide: true, label: 'Ще не вистачає S-предметів',
            html: gapLv.map(lv => `<span class="need-val">${T(lv, 44)}<span class="need-num${b}" style="--nc:${FR[lv.r].d}">${pieces[lv.id]}</span></span><span class="need-unit">${lv.label}</span>`)
              .join('<span class="op op-dark">+</span>'),
            sub: 'дістань готовими або збери — що для цього треба, нижче',
            more: [['Що це', 'найбільші частини злиття, яких немає в інвентарі'],
              ['Копій S для них і решти', res.base], ['Злиттів до цілі', Object.values(res.merges).reduce((a, v) => a + v, 0)]] },
          { id: 'copies', label: 'Копій S-предмета', value: res.base, color: FR.E.d, icon: tile('gear', GEAR[0], 40),
            sub: full.base > res.base ? `з ${full.base} · решта вже є` : 'той самий предмет',
            more: [['Всього з нуля', full.base], ['Вже є в інвентарі', full.base - res.base],
              ['Що це', 'епічні копії саме цього S-предмета']] },
          full.lf && { id: 'lf', label: 'Легендарний фураж', value: needLF, color: FR.L.d, icon: tile('fodder', FOD.L, 40),
            sub: needLF ? '= ' + fmt(epicForLF) + ' епічних' : 'з ' + res.lf,
            more: [['Потрібно для злиття', res.lf], ['Є легендарного фуражу', lfHave],
              lfFromSpare && ['Зі зайвих епічних', lfFromSpare], ['1 легендарний', '8 епічних']] },
          { id: 'ef', label: 'Епічний фураж', value: needEF, color: FR.E.d, icon: tile('fodder', FOD.E, 40),
            sub: 'з ' + res.ef,
            more: [['Потрібно для злиття', res.ef], ['Є епічного фуражу', fod.ef],
              fromLow && ['З нижчих предметів', fromLow],
              lfFromSpare && ['Зайві → на легендарний', lfFromSpare * 8]] },
          greyLeft && {
            id: 'low', wide: true, label: 'Або з нижчих предметів',
            html: LOW.map(l => `<span class="need-val">${tile('item', l, 40)}<span class="need-num${b}" style="--nc:${FR[l.r].d}">${fmt(Math.ceil(greyLeft / l.w))}</span><span class="need-unit">${l.many}</span></span>`)
              .join('<span class="need-or">або</span>'),
            sub: 'на вибір, щоб закрити фураж',
            more: [['Закриває', (gaps || 'фураж') + ' фуражу'], ['Курс', '1 епічний = 3 синіх = 9 зелених = 27 сірих'],
              ['Враховано', 'фураж і нижчі предмети з інвентарю']] }
        ].filter(Boolean);
        lowSteps = lowChain(epicToBuild, fod);
        if (lfShort) {
          lowSteps.push({
            times: lfShort,
            parts: [`<span class="op">8×</span>${tile('fodder', FOD.E, 38)}`],
            result: tile('fodder', FOD.L, 44),
            label: 'Легендарний фураж'
          });
        }
        // progress in epic units: copy = 8, legendary fodder = 8, low items count fractionally
        const fullU = full.base * 8 + full.ef + full.lf * 8;
        const remU = res.base * 8 + Math.max(0, res.ef + lfShort * 8 - fod.ef - lowGrey / GREY_PER_EPIC);
        pct = fullU ? Math.round((1 - remU / fullU) * 100) : 100;
        done = remU === 0;
        mbar = 'Ще ' + res.base + ' копій · ' + needEF + ' + ' + needLF + ' фуражу';
      } else {
        const merges = Object.values(res.merges).reduce((a, v) => a + v, 0);
        // levels below the target, most valuable first, with their cost in common runes
        const below = m.levels.slice(0, m.levels.indexOf(target)).reverse()
          .map(lv => ({ lv, cost: RUNE_COST[lv.id] }));
        // exact gap: greedy split of the missing common runes into the highest levels
        let rest = res.base;
        const gap = below.map(({ lv, cost }) => {
          const n = Math.floor(rest / cost);
          rest -= n * cost;
          return { lv, n };
        }).filter(g => g.n);
        const chip = (lv, n, size) => `<span class="need-val">${T(lv, size)}<span class="need-num${b}" style="--nc:${FR[lv.r].d}">${fmt(n)}</span></span>`;
        needs = res.base ? [
          { id: 'gap', wide: true, label: 'Ще не вистачає',
            html: gap.map(g => chip(g.lv, g.n, 44) + `<span class="need-unit">${g.lv.label}</span>`).join('<span class="op op-dark">+</span>'),
            sub: 'точні дублікати тієї самої руни',
            more: [['Всього з нуля', fmt(full.base) + ' звичайних'], ['Покрито інвентарем', fmt(full.base - res.base) + ' звичайних'],
              ['Ще треба', fmt(res.base) + ' звичайних'], ['Злиттів до цілі', merges]] },
          { id: 'alt', wide: true, label: 'Або лише руни одного рівня',
            html: `<div class="alt-grid">${below.map(({ lv, cost }) =>
              `<div class="alt">${T(lv, 34)}<span class="alt-num">${fmt(Math.ceil(res.base / cost))}</span><span class="alt-name">${lv.label}</span></div>`).join('')}</div>`,
            sub: 'від найцінніших до найслабших' }
        ] : [];
        pct = full.base ? Math.round((1 - res.base / full.base) * 100) : 100;
        done = res.base === 0;
        mbar = gap.length ? 'Ще ' + gap.map(g => g.n + '× ' + g.lv.id).join(' + ') : '';
      }
      pct = Math.max(0, Math.min(100, pct));
      if (done) mbar = 'Готово до злиття!';

      const mainSteps = m.levels.filter(lv => res.merges[lv.id]).map(lv => {
        const r = m.recipes[lv.id];
        const parts = r.parts.map(pid => T(byId[pid], 38));
        for (let i = 0; i < (r.ef || 0); i++) parts.push(tile('fodder', FOD.E, 38));
        for (let i = 0; i < (r.lf || 0); i++) parts.push(tile('fodder', FOD.L, 38));
        return { times: res.merges[lv.id], parts, result: T(lv, 44), label: lv.label };
      });
      const steps = [...lowSteps, ...mainSteps].map(s => `<li>
          <span class="times${b}">×${fmt(s.times)}</span>
          ${s.parts.join('<span class="op" aria-hidden="true">+</span>')}
          <span class="op" aria-hidden="true" style="margin:0 2px">=</span>
          ${s.result}
          <span class="step-label">${s.label}</span>
        </li>`).join('');

      const el = $('result');
      el.style.setProperty('--rb', c.b);
      el.style.setProperty('--rglow', c.b + '66');
      el.innerHTML = `
        ${done ? `<span class="spark" style="top:18px;left:12%;animation-delay:0s" aria-hidden="true"></span>
                  <span class="spark" style="top:40px;right:14%;animation-delay:.5s" aria-hidden="true"></span>
                  <span class="spark" style="top:90px;left:46%;animation-delay:1s" aria-hidden="true"></span>` : ''}
        <div class="result-head">
          ${T(target, 76)}
          <div style="flex:1 1 auto;min-width:0">
            <span class="caps">3. Ще потрібно для</span>
            <h2 class="lf stroke">${target.label}</h2>
          </div>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Прогрес до цілі">
          <div class="bar-fill${done ? ' full' : ''}" style="width:${pct}%"></div>
          <span class="bar-pct lf stroke">${pct}%</span>
        </div>
        ${done ? '<p class="ready lf stroke">Готово до злиття!</p>' : ''}
        <div class="needs">
          ${needs.map(n => {
            const more = (n.more || []).filter(Boolean);
            const open = more.length && ui.info === n.id;
            return `<div class="need${n.wide ? ' wide' : ''}${open ? ' open' : ''}">
              <span class="caps">${n.label}</span>
              ${more.length ? `<button class="info btn" data-info="${n.id}" aria-expanded="${!!open}" aria-label="Детальніше: ${n.label}">${open ? '×' : 'i'}</button>` : ''}
              ${n.wide ? `<div class="need-alts">${n.html}</div>`
                : `<div class="need-val">${n.icon}<span class="need-num${b}" style="--nc:${n.color}">${fmt(n.value)}</span></div>`}
              <span class="need-sub">${n.sub}</span>
            </div>`;
          }).join('')}
          ${(() => {
            const n = needs.find(x => x.id === ui.info && x.more);
            if (!n) return '';
            const rows = n.more.filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${typeof v === 'number' ? fmt(v) : v}</dd>`).join('');
            return `<div class="need-more"><span class="caps">${n.label}</span><dl>${rows}</dl></div>`;
          })()}
        </div>
        <div class="path">
          <span class="caps">Шлях злиття · знизу вгору</span>
          <ol>${steps}</ol>
        </div>
        <p class="footnote">${{
          gear: 'S-предмет випадає щонайменше епічним. 1 легендарний фураж = 8 епічних, 1 епічний фураж = 27 сірих (3 → 1 на кожному кроці). Від Легендарного +1 і вище понизити рівень вже не можна.',
          rune: 'Для злиття потрібні точні дублікати однієї руни. Etched і Blessing працюють однаково.'
        }[mode]}</p>
      `;

      $('mbar').innerHTML = `${T(target, 40)}<span class="mbar-text lf">${mbar}</span><span class="mbar-pct lf">${pct}%</span>`;
    }

    function renderAll(bump) {
      renderTop();
      renderInv(bump);
      renderResult(bump);
    }

    // --- EVENTS ---
    function setCount(key, value) {
      const [scope, id] = key.split(':');
      const v = Math.max(0, Math.floor(value) || 0);
      if (scope === 'fod') {
        state.fod[id] = v;
      } else {
        const inv = { ...state.inv[state.mode] };
        if (v) inv[id] = v; else delete inv[id];
        state.inv[state.mode] = inv;
      }
      save();
    }
    function getCount(key) {
      const [scope, id] = key.split(':');
      return scope === 'fod' ? state.fod[id] : (state.inv[state.mode][id] || 0);
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-mode],[data-target],[data-step],[data-action],[data-info]');
      if (!t) return;
      if (t.dataset.mode) {
        if (state.mode === t.dataset.mode) return;
        state.mode = t.dataset.mode;
        ui.touched.clear();
        save();
        renderAll(false);
      } else if (t.dataset.target) {
        state.t[state.mode] = +t.dataset.target;
        save();
        renderAll(true);
      } else if (t.dataset.step) {
        ui.touched.add(t.dataset.step);
        setCount(t.dataset.step, getCount(t.dataset.step) + +t.dataset.d);
        renderInv(true);
        renderResult(true);
      } else if (t.dataset.action === 'reset') {
        state.inv[state.mode] = {};
        if (state.mode === 'gear') state.fod = { ef: 0, lf: 0, C: 0, F: 0, R: 0 };
        ui.touched.clear();
        save();
        renderInv(true);
        renderResult(true);
      } else if (t.dataset.action === 'all-levels') {
        ui.allLevels = !ui.allLevels;
        renderInv(false);
      } else if (t.dataset.action === 'low') {
        ui.low = !ui.low;
        renderInv(false);
      } else if (t.dataset.info) {
        ui.info = ui.info === t.dataset.info ? null : t.dataset.info;
        renderResult(false);
      }
    });
    // Typing into a counter updates only the result, so the field keeps focus
    document.addEventListener('input', e => {
      if (!e.target.dataset.key) return;
      ui.touched.add(e.target.dataset.key);
      setCount(e.target.dataset.key, +e.target.value);
      renderResult(true);
    });
    document.addEventListener('change', e => {
      if (!e.target.dataset.key) return;
      e.target.value = getCount(e.target.dataset.key);
    });
    document.addEventListener('focusin', e => {
      if (e.target.dataset.key) e.target.select();
    });

    renderAll(false);
  </script>
</body>
</html>
